# The configuration a destination repository keeps at .review/config.yaml.
# `reviewer init` writes one of these; this file is the documented shape, with
# generic values only. Nothing here names a real host, organisation or rule.

# Analyzer plugins. Each is a process the core starts once per run and talks to
# over the plugin protocol. The TypeScript plugin serves every TypeScript
# analyzer from one shared compiler program, so it is one entry, not six.
plugins:
  - id: typescript
    command: node
    # dist/main.js is the executable. The package's "main" field names
    # dist/serve.js, which is the library it is built from: a config pointing
    # there starts a process that exits 0 without answering the handshake, and
    # the review reports "no analyzers ran" with nothing else wrong.
    args: ["node_modules/@adamtait/reviewer-plugin-typescript/dist/main.js"]

analyzers:
  # Bounds a single analyzer. On expiry its process group is killed and the run
  # continues without it.
  timeout: 2m
  # Lines of surrounding source carried into the model lane.
  contextLines: 20
  # Filter by analyzer id. Set one or the other, never both.
  # only: [tsc, eslint]
  # skip: [knip]

# External binaries an analyzer spawns. Absent binaries downgrade that analyzer
# to a warning; they never fail a run.
tools:
  gitleaks:
    version: "8.28.0"
  opengrep:
    version: "1.9.0"
  osv-scanner:
    version: "2.2.3"

rules:
  dir: .review/rules

# Documents the model lane reads as context. Paths are relative to the
# repository root and their contents never leave the destination repository
# unless the model lane is enabled.
guidance:
  - AGENTS.md

# Workspaces or Nx projects, written by `reviewer init` in a monorepo. Empty
# means the whole repository.
projects: []

gate:
  # The analyzers whose successful completion means the diff was actually
  # checked. A list rather than a constant: the gate recognises a credential by
  # the finding's `secrets/` rule namespace, so a replacement scanner works — and
  # a hardcoded name here would undo that by leaving the model lane permanently
  # blocked with "the scan could not run".
  secretsAnalyzers: [gitleaks]

laneB:
  # Off until someone turns it on deliberately. The installer never enables it.
  enabled: false
  # One of: openai-compatible, openai, gemini, anthropic, claude-code, codex.
  provider: openai-compatible
  model: ""
  promptDir: .review/prompts
  # The second pass that tries to disprove each finding before it is emitted.
  invalidate: true

github:
  # No default is compiled in (ADR-0004). For github.com this is
  # https://api.github.com; for GitHub Enterprise, https://<host>/api/v3.
  apiBaseUrl: ""
  repo: ""
  # Only needed where REST and GraphQL are not at github.com's or GitHub
  # Enterprise's usual relative paths — they are siblings, not nested.
  graphqlUrl: ""
  # The account this tool's token posts as, used to tell its own review threads
  # from a human's. GitHub's /user endpoint answers this for a personal token but
  # returns 403 for the installation token an Action runs with, so state it when
  # running in Actions: github-actions[bot].
  selfLogin: ""
  # Resolving a thread is the only action this tool takes on a human's
  # conversation, so it is opt-in.
  resolveStaleThreads: false

baselines:
  type-coverage: .review/type-coverage-baseline.json
